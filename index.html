<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prompt Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F0FC;
    --bg-blob-1: #E9DFFB;
    --bg-blob-2: #FCE4F0;
    --ink: #2B2440;
    --ink-soft: #6B6580;
    --panel: #FFFFFF;
    --line: #ECE6F5;
    --focus: #5B4FE0;
    --accent-purple: #6C4FE0;
    --accent-pink: #E14F9B;
    --accent-blue: #3C9BE0;
    --whatsapp: #25D366;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; }
  ::selection { background: #ded1ff; }

  button:focus-visible,
  input:focus-visible,
  a:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    z-index: 0;
    opacity: 0.55;
    pointer-events: none;
  }
  .bg-blob.b1 { width: 320px; height: 320px; background: var(--bg-blob-1); top: -140px; left: -100px; }
  .bg-blob.b2 { width: 240px; height: 240px; background: var(--bg-blob-2); top: -80px; right: -60px; }

  .shell {
    position: relative;
    z-index: 1;
    display: block;
    min-height: 100%;
  }

  /* ---------- Header ---------- */

  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--line);
  }

  @media (min-width: 500px) {
    .topbar { padding: 22px clamp(16px, 3vw, 36px) 16px; }
  }

  .brand {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    min-width: 0;
  }

  .brand-text { min-width: 0; }

  .brand-text h1 {
    margin: 0;
    font-size: 46px;
    font-weight: 700;
    font-family: "Baloo 2", "Poppins", sans-serif;
    letter-spacing: -0.5px;
    line-height: 0.98;
    cursor: pointer;
    display: block;
  }
  .brand-text h1 .word-1 {
    display: block;
    color: #3446C9;
  }
  .brand-text h1 .word-2 {
    display: block;
    background: linear-gradient(90deg, #E1524F 0%, #E14F9B 55%, #8B4FE0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-text h1:hover { opacity: 0.85; }

  @media (max-width: 500px) {
    .brand-text h1 { font-size: 34px; }
  }

  @media (max-width: 360px) {
    .brand-text h1 { font-size: 29px; }
  }

  .brand-text p {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .brand-text .filter-select {
    margin-top: 10px;
  }

  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    justify-content: flex-end;
  }

  .surprise-btn,
  .filter-select,
  .nav-btn,
  .card-cat,
  .copy-btn,
  .modal-add,
  .modal-actions button,
  .selection-bar button,
  .selection-bar .count,
  .search-input {
    font-family: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 140px;
    max-width: 260px;
  }

  .search-input {
    width: 100%;
    padding: 10px 40px 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 13.5px;
  }

  .search-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .search-btn:hover { background: #F1EDFA; color: var(--accent-purple); }

  .surprise-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
    color: #fff;
    border: none;
    padding: 11px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(108, 79, 224, 0.25);
    flex: none;
  }
  .surprise-btn:hover { filter: brightness(1.05); }

  .filter-select {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 34px 10px 16px;
    border-radius: 999px;
    flex: none;
    width: auto;
    max-width: 100%;
    white-space: normal;
    overflow-wrap: break-word;
  }

  @media (max-width: 560px) {
    .topbar { flex-direction: column; align-items: stretch; }
    .topbar-controls { justify-content: stretch; flex-wrap: wrap; }
    .search-wrap { max-width: none; flex-basis: 100%; }
    .surprise-btn { flex: 1; justify-content: center; padding: 11px 14px; font-size: 13.5px; }
    .brand-text .filter-select { width: 100%; max-width: none; }
  }

  /* ---------- View tabs (favourites / selected) ---------- */

  .view-tabs {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 600;
    min-height: 38px;
  }

  .nav-btn:hover { border-color: #d8cff2; color: var(--ink); }

  .nav-btn.active {
    background: linear-gradient(90deg, #EDE9FB, #FBEAF3);
    border-color: transparent;
    color: var(--accent-purple);
  }

  .nav-btn .badge {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-soft);
    background: #F1EDFA;
    padding: 1px 8px;
    border-radius: 999px;
  }

  .nav-btn.active .badge { color: var(--accent-purple); }

  /* ---------- Main ---------- */

  .main {
    padding: 18px 16px 40px;
    min-width: 0;
  }

  @media (min-width: 500px) {
    .main { padding: 20px clamp(16px, 3vw, 36px) 40px; }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    position: relative;
    border-top: 4px solid var(--cat-color, var(--accent-purple));
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(43, 36, 64, 0.08);
  }

  .card.selected {
    border-color: var(--accent-purple);
    box-shadow: 0 0 0 2px rgba(108, 79, 224, 0.22);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 13px 13px 0;
  }

  .card-check {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 1.5px solid var(--line);
    flex: none;
    margin-top: 2px;
  }

  .card-check input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent-purple);
  }

  .card-cmd {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    font-family: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    letter-spacing: -0.2px;
    padding-top: 1px;
  }

  .card-cat {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 2px 9px;
    border-radius: 999px;
    color: var(--cat-color, var(--accent-purple));
    background: var(--cat-color-soft, #F1EDFA);
    margin: 0 13px 8px;
    width: fit-content;
  }

  .fav-btn {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    flex: none;
  }

  .fav-btn.active { color: var(--accent-pink); }

  .card-body {
    padding: 8px 13px 13px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-desc {
    font-size: 12.8px;
    color: var(--ink-soft);
    line-height: 1.5;
    flex: 1;
  }

  .card-combo {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--accent-purple);
    background: #F5F1FD;
    border-radius: 8px;
    padding: 6px 6px 6px 9px;
    line-height: 1.4;
  }

  .card-combo-text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .card-combo b { font-weight: 500; }

  .card-combo-copy {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--accent-purple);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-combo-copy:hover { background: #E9E0FA; }
  .card-combo-copy.copied { background: var(--accent-purple); color: #fff; }

  .copy-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #FAF9FE;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    min-height: 40px;
  }

  .copy-btn:hover { border-color: var(--accent-purple); color: var(--accent-purple); }
  .copy-btn.copied { background: var(--accent-purple); border-color: var(--accent-purple); color: #fff; }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--ink-soft);
  }
  .empty-state h2 { font-size: 18px; color: var(--ink); margin-bottom: 6px; }

  /* ---------- Selection bar ---------- */

  .selection-bar {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(120%);
    background: var(--ink);
    color: #fff;
    border-radius: 999px;
    padding: 8px 8px 8px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 14px 34px rgba(43, 36, 64, 0.35);
    z-index: 40;
    transition: transform 0.2s ease;
    max-width: calc(100% - 24px);
  }

  .selection-bar.show { transform: translateX(-50%) translateY(0); }

  .selection-bar .count { font-size: 13.5px; font-weight: 600; white-space: nowrap; }

  .selection-bar button {
    border: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }

  .selection-bar .copy-sel {
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
    color: #fff;
  }

  .selection-bar .clear-sel {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  @media (max-width: 420px) {
    .selection-bar .count { display: none; }
  }

  /* ---------- Random modal ---------- */

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(43, 36, 64, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 60;
  }

  .modal {
    background: #fff;
    border-radius: 20px;
    max-width: 400px;
    width: 100%;
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    padding: 24px 22px 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .modal h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 500;
    font-family: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }

  .modal-sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .modal-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    margin-bottom: 16px;
    text-align: left;
  }

  .modal-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #FAF9FE;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 10px 10px 13px;
  }

  .modal-item-body { flex: 1; min-width: 0; }

  .modal-item-cmd {
    font-family: "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
  }

  .modal-item-desc {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
    margin-top: 2px;
  }

  .modal-item-remove {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    width: 24px;
    height: 24px;
    border-radius: 7px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-item-remove:hover { background: #EFE9FA; color: var(--danger, #a13d2e); }

  .modal-add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    padding: 10px;
    border-radius: 999px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--accent-purple);
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 14px;
    min-height: 40px;
  }
  .modal-add:hover { border-color: var(--accent-purple); background: #F8F5FE; }
  .modal-add[disabled] { opacity: 0.5; cursor: not-allowed; }
  .modal-add[disabled]:hover { border-color: var(--line); background: transparent; }

  .modal-actions {
    display: flex;
    gap: 8px;
  }

  .modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 999px;
    border: none;
    font-size: 13.5px;
    font-weight: 500;
    min-height: 42px;
  }

  .modal-again {
    background: #F1EDFA;
    color: var(--accent-purple);
  }

  .modal-copy {
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
    color: #fff;
  }

  .modal-close {
    margin-top: 12px;
    background: none;
    border: none;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: underline;
    padding: 6px;
  }

  /* ---------- Toast ---------- */

  .toast {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Footer ---------- */

  .app-footer {
    grid-column: 1 / -1;
    border-top: 1px solid var(--line);
    padding: 22px 16px calc(26px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .app-footer p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .whatsapp-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--whatsapp);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
    flex: none;
  }
  .whatsapp-btn:hover { filter: brightness(1.05); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-text">
        <h1 id="titleReset" role="button" tabindex="0"><span class="word-1">Prompt</span><span class="word-2">Playground</span></h1>
        <p>400 image-generation commands, ready to combine and copy</p>
        <select id="categoryFilter" class="filter-select" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
        <div class="view-tabs">
          <button class="nav-btn" data-view="favourites">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
            Favourites
            <span class="badge" id="navFavCount">0</span>
          </button>
          <button class="nav-btn" data-view="selected">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            Selected
            <span class="badge" id="navSelCount">0</span>
          </button>
        </div>
      </div>
    </div>
    <div class="topbar-controls">
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Search commands…" aria-label="Search prompts" list="commandSuggestions" autocomplete="off" />
        <datalist id="commandSuggestions"></datalist>
        <button class="search-btn" id="btnSearch" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </div>
      <button class="surprise-btn" id="btnSurprise">Surprise Me</button>
    </div>
  </header>

  <main class="main">
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h2>No prompts match</h2>
      <p>Try a different search or category filter.</p>
    </div>
  </main>

  <footer class="app-footer">
    <a class="whatsapp-btn" id="whatsappBtn" href="#" target="_blank" rel="noopener noreferrer" aria-label="Contact us on WhatsApp">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 004.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.01c-.24.68-1.4 1.3-1.93 1.38-.49.08-1.11.11-1.79-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.54-1.16-2.94 0-1.4.73-2.08.99-2.36.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.98.88 2.13.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.21 1.37.28.14.44.12.61-.07.16-.19.68-.79.87-1.07.19-.28.37-.23.62-.14.26.09 1.64.77 1.92.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
    </a>
    <p>&copy; A PaperWings Studios Production. All rights reserved.<br/>For enquiries or feedback, contact us via WhatsApp.</p>
  </footer>

</div>

<div class="selection-bar" id="selectionBar">

    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------- Filtering ----------

  function getFiltered() {
    var list = DATA;

    if (currentView === "favourites") {
      list = list.filter(function (p) { return favourites.has(p.id); });
    } else if (currentView === "selected") {
      list = list.filter(function (p) { return selectedIds.has(p.id); });
    }

    if (activeCategory) {
      list = list.filter(function (p) { return p.cat === activeCategory; });
    }

    var term = searchTerm.trim().toLowerCase();
    if (term) {
      list = list.filter(function (p) {
        return (p.cmd + " " + p.desc + " " + p.cat).toLowerCase().indexOf(term) !== -1;
      });
    }

    return list;
  }

  // ---------- Card rendering ----------

  function cardHtml(p) {
    var isSelected = selectedIds.has(p.id);
    var isFav = favourites.has(p.id);
    var meta = metaFor(p.cat);

    return (
      '<article class="card' + (isSelected ? " selected" : "") + '" data-id="' + p.id + '" style="--cat-color:' + meta.color + ';">' +
        '<div class="card-top">' +
          '<label class="card-check"><input type="checkbox" data-id="' + p.id + '"' + (isSelected ? " checked" : "") + ' aria-label="Select ' + escapeHtml(p.cmd) + '" /></label>' +
          '<div class="card-cmd">' + escapeHtml(p.cmd) + '</div>' +
          '<button class="fav-btn' + (isFav ? " active" : "") + '" data-fav="' + p.id + '" aria-label="Toggle favourite">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (isFav ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>' +
          '</button>' +
        '</div>' +
        '<span class="card-cat" style="--cat-color:' + meta.color + '; --cat-color-soft:' + meta.color + '1a;">' + escapeHtml(p.cat) + '</span>' +
        '<div class="card-body">' +
          '<div class="card-desc">' + escapeHtml(p.desc) + '</div>' +
          (p.combo ? '<div class="card-combo"><span class="card-combo-text">Try with: <b>' + escapeHtml(p.combo) + '</b></span><button class="card-combo-copy" data-copy-combo="' + p.id + '" aria-label="Copy combination for ' + escapeHtml(p.cmd) + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg></button></div>' : '') +
          '<button class="copy-btn" data-copy="' + p.id + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>' +
            'Copy Prompt' +
          '</button>' +
        '</div>' +
      '</article>'
    );
  }

  function renderGrid() {
    var grid = document.getElementById("grid");
    var empty = document.getElementById("emptyState");
    var filtered = getFiltered();

    if (filtered.length === 0) {
      grid.innerHTML = "";
      empty.style.display = "block";
      if (currentView === "favourites") {
        empty.querySelector("h2").textContent = "No favourites yet";
        empty.querySelector("p").textContent = "Tap the heart on any card to save it here.";
      } else if (currentView === "selected") {
        empty.querySelector("h2").textContent = "Nothing selected yet";
        empty.querySelector("p").textContent = "Tick the checkbox on any card to add it here.";
      } else {
        empty.querySelector("h2").textContent = "No prompts match";
        empty.querySelector("p").textContent = "Try a different search or category filter.";
      }
      return;
    }
    empty.style.display = "none";
    grid.innerHTML = filtered.map(cardHtml).join("");

    Array.prototype.forEach.call(grid.querySelectorAll(".card-check input"), function (box) {
      box.addEventListener("change", function () {
        var id = parseInt(box.getAttribute("data-id"), 10);
        if (box.checked) selectedIds.add(id); else selectedIds.delete(id);
        render();
      });
    });
    Array.prototype.forEach.call(grid.querySelectorAll(".fav-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var id = parseInt(btn.getAttribute("data-fav"), 10);
        if (favourites.has(id)) favourites.delete(id); else favourites.add(id);
        saveFavourites();
        render();
      });
    });
    Array.prototype.forEach.call(grid.querySelectorAll("[data-copy]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = parseInt(btn.getAttribute("data-copy"), 10);
        var p = DATA.find(function (x) { return x.id === id; });
        if (!p) return;
        copyToClipboard(p.cmd + " — " + p.desc).then(function () {
          var original = btn.innerHTML;
          btn.classList.add("copied");
          btn.innerHTML = "Copied!";
          setTimeout(function () { btn.classList.remove("copied"); btn.innerHTML = original; }, 1100);
          showToast(p.cmd + " copied to clipboard");
        }).catch(function () { showToast("Could not copy — check clipboard permissions."); });
      });
    });
    Array.prototype.forEach.call(grid.querySelectorAll("[data-copy-combo]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = parseInt(btn.getAttribute("data-copy-combo"), 10);
        var p = DATA.find(function (x) { return x.id === id; });
        if (!p || !p.combo) return;
        copyToClipboard(p.combo).then(function () {
          var original = btn.innerHTML;
          btn.classList.add("copied");
          btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
          setTimeout(function () { btn.classList.remove("copied"); btn.innerHTML = original; }, 1100);
          showToast("Combination copied to clipboard");
        }).catch(function () { showToast("Could not copy — check clipboard permissions."); });
      });
    });
  }

  // ---------- Nav ----------

  function renderNav() {
    Array.prototype.forEach.call(document.querySelectorAll(".nav-btn"), function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-view") === currentView);
    });
    document.getElementById("navFavCount").textContent = favourites.size;
    document.getElementById("navSelCount").textContent = selectedIds.size;
  }

  Array.prototype.forEach.call(document.querySelectorAll(".nav-btn"), function (btn) {
    btn.addEventListener("click", function () {
      currentView = btn.getAttribute("data-view");
      render();
    });
  });

  var titleReset = document.getElementById("titleReset");
  function resetToAll() {
    currentView = "all";
    activeCategory = "";
    document.getElementById("categoryFilter").value = "";
    render();
  }
  titleReset.addEventListener("click", resetToAll);
  titleReset.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); resetToAll(); }
  });

  // ---------- Selection bar ----------

  function renderSelectionBar() {
    var bar = document.getElementById("selectionBar");
    if (selectedIds.size > 0) {
      bar.classList.add("show");
      document.getElementById("selectionCount").textContent =
        selectedIds.size + (selectedIds.size === 1 ? " selected" : " selected");
    } else {
      bar.classList.remove("show");
    }
  }

  document.getElementById("btnClearSel").addEventListener("click", function () {
    selectedIds.clear();
    render();
  });

  document.getElementById("btnCopySel").addEventListener("click", function () {
    var list = DATA.filter(function (p) { return selectedIds.has(p.id); });
    if (list.length === 0) return;
    var text = list.map(function (p) { return p.cmd; }).join(" + ");
    copyToClipboard(text).then(function () {
      showToast(list.length + " prompts combined and copied");
    }).catch(function () { showToast("Could not copy — check clipboard permissions."); });
  });

  // ---------- Random / surprise (multi-pick) ----------

  var surpriseIds = [];

  function pickRandomUnused() {
    var pool = DATA.filter(function (p) { return surpriseIds.indexOf(p.id) === -1; });
    if (pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function renderModalList() {
    var list = document.getElementById("modalList");
    var items = surpriseIds.map(function (id) {
      return DATA.find(function (p) { return p.id === id; });
    }).filter(Boolean);

    list.innerHTML = items.map(function (p) {
      return (
        '<div class="modal-item">' +
          '<div class="modal-item-body">' +
            '<div class="modal-item-cmd">' + escapeHtml(p.cmd) + '</div>' +
            '<div class="modal-item-desc">' + escapeHtml(p.desc) + '</div>' +
          '</div>' +
          '<button class="modal-item-remove" data-remove="' + p.id + '" aria-label="Remove ' + escapeHtml(p.cmd) + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
          '</button>' +
        '</div>'
      );
    }).join("");

    document.getElementById("modalSub").textContent =
      items.length + (items.length === 1 ? " prompt picked" : " prompts picked");

    Array.prototype.forEach.call(list.querySelectorAll("[data-remove]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = parseInt(btn.getAttribute("data-remove"), 10);
        surpriseIds = surpriseIds.filter(function (x) { return x !== id; });
        renderModalList();
      });
    });

    var addBtn = document.getElementById("modalAdd");
    addBtn.disabled = surpriseIds.length >= DATA.length;
  }

  function openRandomModal() {
    surpriseIds = [];
    var p = pickRandomUnused();
    if (p) surpriseIds.push(p.id);
    renderModalList();
    document.getElementById("modalBackdrop").style.display = "flex";
  }

  document.getElementById("btnSurprise").addEventListener("click", openRandomModal);

  document.getElementById("modalAdd").addEventListener("click", function () {
    var p = pickRandomUnused();
    if (!p) { showToast("All prompts are already picked."); return; }
    surpriseIds.push(p.id);
    renderModalList();
  });

  document.getElementById("modalClose").addEventListener("click", function () {
    document.getElementById("modalBackdrop").style.display = "none";
  });
  document.getElementById("modalBackdrop").addEventListener("click", function (e) {
    if (e.target === this) this.style.display = "none";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") document.getElementById("modalBackdrop").style.display = "none";
  });

  document.getElementById("modalCopy").addEventListener("click", function () {
    if (surpriseIds.length === 0) { showToast("Nothing picked yet."); return; }
    var items = surpriseIds.map(function (id) {
      return DATA.find(function (p) { return p.id === id; });
    }).filter(Boolean);
    var text = items.length === 1
      ? items[0].cmd + " — " + items[0].desc
      : items.map(function (p) { return p.cmd; }).join(" + ");
    copyToClipboard(text).then(function () {
      showToast(items.length === 1 ? items[0].cmd + " copied to clipboard" : items.length + " prompts combined and copied");
    }).catch(function () { showToast("Could not copy — check clipboard permissions."); });
  });

  document.getElementById("modalAddToSelected").addEventListener("click", function () {
    if (surpriseIds.length === 0) { showToast("Nothing picked yet."); return; }
    surpriseIds.forEach(function (id) { selectedIds.add(id); });
    showToast(surpriseIds.length + " added to Selected");
    document.getElementById("modalBackdrop").style.display = "none";
    render();
  });

  // ---------- Category filter ----------

  function populateCategoryFilter() {
    var select = document.getElementById("categoryFilter");
    var cats = Array.from(new Set(DATA.map(function (p) { return p.cat; }))).sort();
    cats.forEach(function (cat) {
      var opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
    select.addEventListener("change", function () {
      activeCategory = this.value;
      render();
    });
  }
  populateCategoryFilter();

  // ---------- Search ----------

  function populateSearchSuggestions() {
    var list = document.getElementById("commandSuggestions");
    list.innerHTML = DATA.map(function (p) {
      return '<option value="' + escapeHtml(p.cmd.slice(1)) + '">';
    }).join("");
  }
  populateSearchSuggestions();

  function runSearch() {
    searchTerm = document.getElementById("searchInput").value;
    render();
  }

  document.getElementById("searchInput").addEventListener("input", runSearch);
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") runSearch();
  });
  document.getElementById("btnSearch").addEventListener("click", runSearch);

  // ---------- WhatsApp footer link ----------

  document.getElementById("whatsappBtn").href = "https://wa.me/" + WHATSAPP_NUMBER;

  // ---------- Master render ----------

  function render() {
    renderNav();
    renderGrid();
    renderSelectionBar();
  }

  render();
})();
</script>
</body>
</html>
